name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.33
      - name: Build
        run: |
          buildozer init
          sed -i 's/^title = .*/title = ToDo App/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = todoapp/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.vansh/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          yes | buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: todoapp-apk
          path: bin/*.apk
